<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nova senha — GameCloudHostinger</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav class="nav" id="nav">
      <a class="brand" href="index.html"><span class="brand-mark">GC</span> GameCloudHostinger</a>
      <div class="nav-links" style="margin-left:auto"><a href="index.html#planos">Planos</a><a href="index.html#suporte">Suporte</a></div>
    </nav>
  </div>
</header>
<main class="auth-wrap">
  <div class="auth-card">
    <h1>Definir nova senha</h1>
    <p class="sub">Escolha uma senha nova para sua conta.</p>
    <div id="formMsg" class="alert" hidden></div>
    <form id="newPasswordForm" novalidate>
      <div class="field">
        <label for="password">Nova senha</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="field">
        <label for="confirmPassword">Repita a nova senha</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Salvar nova senha</button>
    </form>
    <p class="auth-foot"><a href="login.html">Voltar para o login</a></p>
  </div>
</main>
<script type="module" src="js/auth.js"></script>
</body>
</html>
